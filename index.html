<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的资料助手</title><style>
:root{--ink:#273650;--muted:#66748b;--accent:#5d5cb1;--line:#dde2ed;--paper:#f5f6fb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{background:var(--accent);color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e8e9f5;color:var(--ink)}.danger{background:white;border:1px solid #e6d0ce;color:#955347;padding:5px 10px;font-size:13px}header{max-width:1260px;padding:32px 28px 18px;margin:auto}h1{font-size:31px;margin:0}header p{margin:5px 0;color:var(--muted)}.tag{font-size:12px;letter-spacing:2px;color:var(--accent)}main{max-width:1260px;display:grid;grid-template-columns:310px 1fr;gap:22px;padding:0 28px 32px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}h2{font-size:19px;margin:0 0 14px}label{display:block;font-size:14px}input[type=file]{max-width:100%;font-size:13px}select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px}textarea{resize:vertical;min-height:92px}small,.muted{color:var(--muted);font-size:13px}.note{padding:12px 15px;background:#f0f1f9;border-radius:8px;font-size:13px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.doc{border-top:1px solid var(--line);padding:12px 0}.doc strong{overflow-wrap:anywhere;font-size:14px}.doc .row{justify-content:space-between}.msg{padding:17px 20px;border:1px solid var(--line);border-radius:10px;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:35px;background:#f1f0fa}.msg.assistant{margin-right:20px}.msg .role{font-weight:600;color:var(--accent);font-size:13px;margin-bottom:7px}details{font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}summary{cursor:pointer;color:var(--accent)}.excerpt{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f8fc;padding:12px;margin:8px 0}#status{min-height:26px;color:#8b5441;font-size:14px}#messages:empty:before{content:'先导入示例资料，再问：摄影课退款需要提前多久申请？';display:block;padding:35px 10px;color:var(--muted)}.busy{color:var(--accent)}@media(max-width:760px){header{padding:22px 16px 14px}main{display:block;padding:0 16px 20px}.panel{padding:17px}h1{font-size:25px}.msg.user,.msg.assistant{margin-left:0;margin-right:0}}
</style></head><body><header><div class="tag">LOCAL KNOWLEDGE WORKSHOP</div><h1>我的资料助手</h1><p>上传资料，查看出处；重启服务后，文档和会话仍在。</p></header><main><aside><section class="panel"><h2>① 准备资料</h2><button id="demo" class="secondary">导入示例资料</button><p><label for="upload">上传 UTF-8 的 TXT / Markdown（单文件 ≤ 1 MB）</label><input id="upload" type="file" accept=".txt,.md" multiple></p><div id="documents"></div></section><section class="panel"><h2>② 选择会话</h2><select id="sessions" aria-label="选择历史会话"></select><div class="row" style="margin-top:12px"><button id="new" class="secondary">新建会话</button><button id="delete-session" class="danger">删除会话</button></div><p><small>聊天记录用于保存和展示；本版每次按当前问题检索，追问请写明关键词。</small></p></section></aside><section class="panel"><h2>③ 从资料中查答案</h2><div class="note">默认仅检索，不调用模型。启用模型后，本次问题、工具返回的文档名与命中片段会发送到你配置的服务；请先用公开资料练习。出处编号可核对，回答仍需检查原文。</div><div class="row"><label><input id="generate" type="checkbox"> 使用 DSH 智能体检索并回答</label><small id="model-status"></small></div><div id="messages"></div><form id="ask"><label for="question">你的问题</label><textarea id="question" maxlength="1000" placeholder="例如：摄影课退款需要提前多久申请？" required></textarea><div class="row" style="margin-top:10px"><button id="send" type="submit">查询资料</button><small>DSH 模式由模型调用工具，最多 5 步。</small></div></form><p id="status" aria-live="polite"></p></section></main><script>
const $=id=>document.getElementById(id);let active='';let busy=false;
async function api(path,method='GET',data){const opts={method};if(data!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(data)}const r=await fetch(path,opts);const result=await r.json();if(!r.ok)throw Error(result.error||'请求失败');return result}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function status(message){$('status').textContent=message}
function controls(disabled){busy=disabled;for(const id of ['send','demo','upload','sessions','new','delete-session','generate'])$(id).disabled=disabled;$('question').disabled=disabled;document.querySelectorAll('[data-delete-document]').forEach(b=>b.disabled=disabled)}
async function docs(){const list=await api('/api/documents');$('documents').replaceChildren();for(const d of list){const card=node('div',undefined,'doc');card.append(node('strong',d.name));const row=node('div',undefined,'row');row.append(node('small',d.chunk_count+' 个片段'));const b=node('button','删除','danger');b.dataset.deleteDocument=d.id;b.onclick=async()=>{if(!confirm('从新检索中移除此文档？历史会话中的引用快照仍会保留。'))return;try{await api('/api/documents/'+d.id,'DELETE',{});await docs();status('文档和检索索引已删除。')}catch(e){status(e.message)}};row.append(b);card.append(row);$('documents').append(card)}}
async function sessions(preferred){let list=await api('/api/sessions');if(!list.length){const n=await api('/api/sessions','POST',{});list=await api('/api/sessions');preferred=n.session_id}active=preferred||active||list[0].id;if(!list.some(s=>s.id===active))active=list[0].id;$('sessions').replaceChildren();for(const s of list){const option=node('option',s.title);option.value=s.id;$('sessions').append(option)}$('sessions').value=active;await messages()}
async function messages(){const list=await api('/api/messages?session_id='+encodeURIComponent(active));$('messages').replaceChildren();for(const m of list){const box=node('div',undefined,'msg '+m.role);box.append(node('div',m.role==='user'?'你':'资料助手','role'));box.append(node('div',m.content));if(m.sources.length){const detail=node('details');detail.append(node('summary','查看 '+m.sources.length+' 个来源片段'));for(const s of m.sources){detail.append(node('strong','['+s.source_id+'] '+s.name+' · 片段 '+s.ordinal));detail.append(node('div',s.content,'excerpt'))}box.append(detail)}$('messages').append(box)}const runs=await api('/api/runs?session_id='+encodeURIComponent(active));if(runs.length){const detail=node('details');detail.append(node('summary','查看智能体检索过程（'+runs.length+' 次运行）'));for(const run of runs){detail.append(node('strong',run.created_at+' · '+run.finish_reason));for(const event of run.events){if(event.type==='tool/call')detail.append(node('div',event.data.name+' '+event.data.arguments,'excerpt'))}detail.append(node('small','DSH 会话：'+run.harness_session_id))}$('messages').append(detail)}}
$('demo').onclick=async()=>{controls(true);try{await api('/api/demo','POST',{});await docs();status('示例资料已导入；相同内容不会重复入库。')}catch(e){status(e.message)}finally{controls(false)}};
$('upload').onchange=async()=>{const files=[...$('upload').files];controls(true);try{for(const f of files){if(f.size>1024*1024)throw Error(f.name+' 超过 1 MB');const content=new TextDecoder('utf-8',{fatal:true}).decode(await f.arrayBuffer());await api('/api/documents','POST',{name:f.name,content})}await docs();status('资料已保存并建立检索索引。')}catch(e){status(e.message)}finally{$('upload').value='';controls(false)}};
$('new').onclick=async()=>{try{const n=await api('/api/sessions','POST',{});await sessions(n.session_id)}catch(e){status(e.message)}};
$('sessions').onchange=async()=>{active=$('sessions').value;try{await messages()}catch(e){status(e.message)}};
$('delete-session').onclick=async()=>{if(!confirm('删除当前会话及其消息和引用快照？'))return;try{await api('/api/sessions/'+active,'DELETE',{});active='';await sessions()}catch(e){status(e.message)}};
$('ask').onsubmit=async e=>{e.preventDefault();const question=$('question').value.trim();if(!question||busy)return;controls(true);status($('generate').checked?'DSH 正在调用知识库工具，请稍候…':'正在检索本地资料…');try{const result=await api('/api/ask','POST',{session_id:active,question,mode:$('generate').checked?'generate':'retrieve'});$('question').value='';await sessions(active);status(result.status==='model_error'?'调用未完成，原因已显示；检索片段仍可查看。':'本次记录已保存。')}catch(err){status(err.message)}finally{controls(false)}};
(async()=>{try{const c=await api('/api/config');$('model-status').textContent=c.model_ready?'模型凭证已配置':'未配置 Key，可先练习本地检索';await docs();await sessions()}catch(e){status(e.message)}})();
</script></body></html>
